[package]
name = "aseprite-extension"
version = "0.1.0"
edition = "2024"

[lib]
name = "test"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
flume = "0.12"
libc = "0.2"
mlua = { version = "0.12", features = ["lua54", "module"] }
ureq = "3.4"

[build-dependencies]
cc = "1.4"

[profile.release]
debug = "line-tables-only"
strip = "symbols"
